version: '3.8'

services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: generic-rag-neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: generic-rag-backend
    ports:
      - "5005:5005"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - LLM_API_BASE=http://host.docker.internal:11434/v1
      - LLM_MODEL_NAME=gemma4:12b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - neo4j
    restart: always

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: generic-rag-ui
    ports:
      - "3006:80"
    depends_on:
      - backend
    restart: always

volumes:
  neo4j_data:
